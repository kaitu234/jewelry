<style>
:root{--bg:#F4EFE8;--paper:#FBF8F2;--line:#E2D9CB;--ink:#2F2925;--logo:#54483F;--ash:#7A7064;--seal:#A8322A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--logo);border-radius:10px;padding:28px 26px 22px;box-shadow:0 1px 2px rgba(84,72,63,.05),0 12px 32px rgba(84,72,63,.10)}
form{display:grid;gap:14px}
.lg{width:190px;height:auto;display:block;margin:0 auto 4px}

p{margin:0;color:var(--ash);font-size:13px;text-align:center}
.fi{display:grid;gap:5px}
.fi span{font:500 10px/1.2 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
input[type=password]:focus{outline:0;border-color:var(--logo);box-shadow:0 0 0 3px rgba(84,72,63,.15)}
label.nho{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ash)}
input[type=checkbox]{accent-color:var(--logo);width:16px;height:16px}
button{padding:12px;border:0;border-radius:8px;background:var(--logo);color:var(--paper);font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#3E3530}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--seal);min-height:1.2em;font-size:13px;text-align:center}
.prog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;width:0;background:var(--logo);transition:width .25s}
.pt{font:500 10.5px/1.3 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);text-align:center}
.nhanh{max-width:760px;display:grid;gap:14px}
.nhanh .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nhanh .hd .lg{width:120px;margin:0}
.nhanh h2{margin:0;font-size:20px;font-weight:600}.nhanh h2 em{font-style:normal;font-weight:300;color:var(--ash)}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kp div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.kp div.m{background:linear-gradient(160deg,#3E3530,#54483F 70%);border-color:#3E3530;color:#FBF8F2}
.kp b{font:600 22px/1.15 'Be Vietnam Pro',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.kp span{font:500 9.5px/1.3 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.kp div.m span,.kp div.m small{color:#DCCFC0}
.kp small{font-size:11.5px;color:var(--ash)}
.cy{display:grid;gap:6px;text-align:left}
.cy div{padding:8px 10px;border-radius:6px;background:#F5E0DC;border-left:3px solid var(--seal);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line);padding:3px 10px;border-radius:99px;color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:#B8975A}.chip.ok i{background:#3F6B47}.chip.err i{background:var(--seal)}
@media (max-width:560px){.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.box{padding:22px 18px}}
.ft{margin-top:18px;text-align:center;font:500 10px/1.6 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
</style></head><body>
<main><div class="box">
<form id="f" autocomplete="off">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 420 188" class="lg" aria-label="Kai Jewelry" role="img"><g transform="translate(0 0) scale(1.1)"><g fill="none" stroke="#54483F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M22 2h56l20 28-48 58L2 30z"/><path d="M2 30h96M22 2l14 28 14-28 14 28 14-28M36 30l14 58M64 30L50 88"/></g></g>
<g transform="translate(134 0)"><g fill="none" stroke="#54483F" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M8 0v100M71 0L10 54M10 50l69 50"/><path d="M110 100l36-100h6l36 100M126 68h46"/><path d="M228 0v100"/></g></g>
<g transform="translate(205.5 118)"><g transform="scale(0.3)" fill="none" stroke="#54483F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0)" d="M30 0v20a14 14 0 0 1-28 0"/><path transform="translate(46)" d="M30 0H2v28h28M2 14h22"/><path transform="translate(92)" d="M0 0l8 28 10-18 10 18 8-28"/><path transform="translate(138)" d="M30 0H2v28h28M2 14h22"/><path transform="translate(184)" d="M2 0v28h28"/><path transform="translate(230)" d="M2 28V0h18a11 11 0 0 1 0 22H2M18 22l14 6"/><path transform="translate(276)" d="M0 0l16 14 16-14M16 14v14"/></g></g>
<path d="M134 122h57.5M312.5 122H370" stroke="#54483F" stroke-width="2.6" stroke-linecap="round"/></svg>
<div class="eb">Internal working file</div>
<h1>Đăng nhập</h1>
<p>Hub thương hiệu và số liệu Kai Jewelry. Mỗi máy nhập một lần nếu chọn nhớ.</p>
<label class="fi"><span>Mật khẩu</span><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" autofocus></label>
<label class="nho"><input type="checkbox" id="nho" checked> Nhớ trên máy này</label>
<button id="b">Đăng nhập</button>
<div class="err" id="e" role="alert"></div>
<div class="prog" id="pg" hidden><i></i></div><div class="pt" id="pt" hidden></div>
</form></div>
<div class="box nhanh" id="nhanh" hidden>
  <div class="hd"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 420 188" class="lg" aria-label="Kai Jewelry" role="img"><g transform="translate(0 0) scale(1.1)"><g fill="none" stroke="#54483F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M22 2h56l20 28-48 58L2 30z"/><path d="M2 30h96M22 2l14 28 14-28 14 28 14-28M36 30l14 58M64 30L50 88"/></g></g>
<g transform="translate(134 0)"><g fill="none" stroke="#54483F" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M8 0v100M71 0L10 54M10 50l69 50"/><path d="M110 100l36-100h6l36 100M126 68h46"/><path d="M228 0v100"/></g></g>
<g transform="translate(205.5 118)"><g transform="scale(0.3)" fill="none" stroke="#54483F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path transform="translate(0)" d="M30 0v20a14 14 0 0 1-28 0"/><path transform="translate(46)" d="M30 0H2v28h28M2 14h22"/><path transform="translate(92)" d="M0 0l8 28 10-18 10 18 8-28"/><path transform="translate(138)" d="M30 0H2v28h28M2 14h22"/><path transform="translate(184)" d="M2 0v28h28"/><path transform="translate(230)" d="M2 28V0h18a11 11 0 0 1 0 22H2M18 22l14 6"/><path transform="translate(276)" d="M0 0l16 14 16-14M16 14v14"/></g></g>
<path d="M134 122h57.5M312.5 122H370" stroke="#54483F" stroke-width="2.6" stroke-linecap="round"/></svg><span class="chip" id="nChip"><i></i><span>Đang lấy số từ Sheet…</span></span></div>
  <h2>Tổng quan <em>số nhanh trong lúc mở Hub</em></h2>
  <div class="kp" id="nKp"></div>
  <div class="cy" id="nCy"></div>
  <div><div class="prog"><i id="nPg"></i></div><div class="pt" id="nPt" style="margin-top:6px">Đang mở Hub…</div></div>
</div>
<div class="ft">429 Phan Huy Ích · Chi tiết nhỏ, phong thái lớn.</div></main>
<script>
const SALT="HnBmNrJnnuo/MunCcKZKUA==",IV="d4yHvE/YNNEB+ixm",ITER=600000,LS="kai_hub_key",BAN="ed86a9afb4cf",FILE="hub-ed86a9afb4cf.bin";
/* chạy bên trong Hub sau khi mở: 5 phút/lần và khi quay lại tab, đọc version.json; khác BAN → nút "Có cập nhật mới — bấm để tải lại" */
function kiemBanMoi(BAN){
  let lan=0;
  async function k(){
    if(document.getElementById("kaiBanMoi")||location.protocol!=="https:"||Date.now()-lan<60000)return;lan=Date.now();
    try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=await r.json();
      if(v.ban&&v.ban!==BAN){const b=document.createElement("button");b.id="kaiBanMoi";b.type="button";
        b.textContent="Có cập nhật mới"+(v.luc?" ("+v.luc+")":"")+" — bấm để tải lại";
        b.style.cssText="position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:2147483647;background:#54483F;color:#FBF8F2;border:0;border-radius:99px;padding:11px 20px;font:600 14px/1.3 system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer";
        b.onclick=()=>location.reload();document.body.appendChild(b);}
    }catch(e){}
  }
  setInterval(k,5*60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)k()});setTimeout(k,20000);
}
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
/* ---- tải file Hub đã mã hóa: lấy từ bộ nhớ trình duyệt nếu đúng bản, không thì tải (có %) rồi cất ---- */
let tienDo=()=>{};
const taiHub=(async()=>{
  const C=("caches" in window)&&location.protocol==="https:"?await caches.open("kai-hub").catch(()=>null):null;
  if(C){const m=await C.match(FILE).catch(()=>null);if(m){tienDo(1);return new Uint8Array(await m.arrayBuffer())}}
  const r=await fetch(FILE);if(!r.ok)throw new Error("Không tải được Hub ("+r.status+")");
  const tong=+r.headers.get("content-length")||0,rd=r.body.getReader(),parts=[];let n=0;
  for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);n+=value.length;if(tong)tienDo(Math.min(n/tong,.99))}
  const buf=new Uint8Array(n);let o=0;for(const p of parts){buf.set(p,o);o+=p.length}tienDo(1);
  if(C){try{for(const k of await C.keys())if(!k.url.endsWith(FILE))await C.delete(k);await C.put(FILE,new Response(buf.slice()))}catch(e){}}
  return buf;
})();
taiHub.catch(()=>{});
async function mo(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,await taiHub);
  const text=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(text+"<script>("+kiemBanMoi.toString()+")("+JSON.stringify(BAN)+")<\/script>");document.close();
}
async function tuMatKhau(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.normalize("NFC")),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(SALT),iterations:ITER},base,256));
}
/* ---- Tổng quan nhanh: chỉ hiện khi máy đã nhớ mật khẩu Hub (không lộ số trước khi đăng nhập) ---- */
const N=v=>{const x=typeof v==="number"?v:parseFloat(String(v||"").replace(/\./g,"").replace(",","."));return isFinite(x)?x:0};
const K=v=>{const x=N(v);if(!x)return"–";return Math.abs(x)>=1e6?(x/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr":Math.round(x/1000)+"K"};
const E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function veNhanh(D,ghi){
  if(!D||!D.SanPham||!$("nKp"))return;const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const ngay=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?new Date(+m[1],m[2]-1,+m[3]):null};
  const han=h=>{const m=/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/.exec(h||"");if(!m)return null;let y=m[3]?+m[3]:now.getFullYear();if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1])};
  const th=(D.DonHang||[]).filter(r=>{const d=ngay(r["Ngày"]);return d&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()&&!["Hủy","Hoàn"].includes(r["Trạng thái"])});
  const mo=(D.Viec||[]).filter(r=>!["Xong","Bỏ"].includes(r["Trạng thái"])),tre=mo.filter(r=>{const h=han(r["Hạn"]);return h&&h<t0});
  const sp=D.SanPham,ton=sp.reduce((a,r)=>a+Math.max(0,N(r["Tồn"])),0),lh=(D.LoHang||[]).filter(r=>["Đã đặt","Đang về"].includes(r["Trạng thái"]));
  $("nKp").innerHTML=[["m","Doanh thu tháng",K(th.reduce((a,r)=>a+N(r["Thực nhận"]),0)),th.length+" dòng đơn"],["","Mã theo dõi",sp.length,sp.filter(r=>r["Trạng thái"]==="Đang bán").length+" đang bán"],["","Tồn kho",ton.toLocaleString("vi-VN"),"món"],["","Lô đang về",lh.length,K(lh.reduce((a,r)=>a+N(r["Thành tiền"]),0))+" vốn"],["","KOC",(D.KOC||[]).length,(D.KOC||[]).filter(r=>r["Trạng thái"]==="Đã đăng").length+" đã đăng"],["","Việc còn mở",mo.length,tre.length+" quá hạn"]].map(x=>'<div class="'+x[0]+'"><span>'+x[1]+'</span><b>'+x[2]+'</b><small>'+x[3]+'</small></div>').join("");
  $("nCy").innerHTML=tre.slice(0,4).map(r=>"<div><b>Quá hạn "+E(r["Hạn"])+":</b> "+E(r["Việc"])+"</div>").join("");
  const c=$("nChip");c.className="chip "+(ghi==="ok"?"ok":ghi==="err"?"err":"");c.lastElementChild.textContent=ghi==="ok"?"Sheet · cập nhật "+now.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}):ghi==="err"?"Mất kết nối · số lần trước":"Số lần trước · đang lấy số mới…";
}
async function soNhanh(){
  let cfg=null,cache=null;try{cfg=JSON.parse(lsGet("kj_cfg")||"null");cache=JSON.parse(lsGet("kj_cache")||"null")}catch(e){}
  if(!cfg){$("nhanh").querySelector("h2").innerHTML="Đang mở Hub <em>chưa kết nối Sheet trên máy này</em>";$("nChip").hidden=true;return}
  if(cache)veNhanh(cache,"");
  try{const u=new URL(cfg.api);u.searchParams.set("key",cfg.key);u.searchParams.set("action","all");
    const j=await (await fetch(u,{redirect:"follow"})).json();if(!j.ok)throw new Error(j.loi);
    try{localStorage.setItem("kj_cache",JSON.stringify(j.du));localStorage.setItem("kj_sheet",JSON.stringify(j.sheet||""));localStorage.setItem("kj_at",JSON.stringify(Date.now()))}catch(e){}
    veNhanh(j.du,"ok");
  }catch(e){if(cache)veNhanh(cache,"err");}
}
(async()=>{const k=lsGet(LS);
  if(k){$("f").closest(".box").hidden=true;$("nhanh").hidden=false;
    tienDo=p=>{$("nPg").style.width=Math.round(p*100)+"%";$("nPt").textContent=p<1?"Đang tải Hub… "+Math.round(p*100)+"%":"Đang mở Hub…"};
    soNhanh();
    try{await mo(b64(k));return}catch(e){try{localStorage.removeItem(LS)}catch(_){}$("nhanh").hidden=true;$("f").closest(".box").hidden=false;$("e").textContent="Không tự mở được, gõ lại mật khẩu."}}
})();
$("f").addEventListener("submit",async ev=>{ev.preventDefault();
  const pw=$("pw").value,b=$("b"),e=$("e");
  if(!pw)return;b.disabled=true;b.textContent="Đang mở Hub…";e.textContent="";
  $("pg").hidden=false;$("pt").hidden=false;tienDo=p=>{$("pg").firstElementChild.style.width=Math.round(p*100)+"%";$("pt").textContent=p<1?"Đang tải Hub… "+Math.round(p*100)+"%":"Đang giải mã…"};
  const nho=$("nho").checked;
  try{const raw=await tuMatKhau(pw);if(nho){try{localStorage.setItem(LS,toB64(raw))}catch(_){}}await mo(raw);}
  catch(err){try{localStorage.removeItem(LS)}catch(_){}b.disabled=false;b.textContent="Đăng nhập";$("pg").hidden=true;$("pt").hidden=true;e.textContent=/tải/.test(err.message||"")?err.message:"Sai mật khẩu. Thử lại.";}
});
</script>
