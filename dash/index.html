<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#54483F">
<title>Kai Jewelry · Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2354483F'/%3E%3Cg transform='translate(9 11) scale(.46)' fill='none' stroke='%23DCCFC0' stroke-width='9' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M22 2h56l20 28-48 58L2 30z'/%3E%3Cpath d='M2 30h96M22 2l14 28 14-28 14 28 14-28M36 30l14 58M64 30L50 88'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Khung giống dashboard Kai Café: thanh trái (nhóm tab) + vùng chính (tiêu đề tab · mục lục · thẻ). Nhận diện Kai Jewelry tone taupe (chốt 16/11). */
:root{
  --bg:#F4EFE8; --paper:#FBF8F2; --surface:#FFFFFF; --surface-2:#F4EFE8; --ink:#2F2925; --muted:#7A7064; --line:#E2D9CB;
  --brand:#54483F; --brand-ink:#FBF8F2; --beige:#EDE5DA; --accent:#B8975A; --seal:#A8322A; --cream:#DCCFC0;
  --good:#3F6B47; --good-bg:#E1ECE2; --warn:#8A6417; --warn-bg:#F4E8CC; --bad:#A8322A; --bad-bg:#F5E0DC;
  --c1:#54483F; --c2:#B8975A; --c3:#8C7B6B; --c4:#A8322A; --c5:#5F6B4A;
  --f-body:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(84,72,63,.05),0 6px 18px rgba(84,72,63,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1916; --paper:#26211D; --surface:#2A2420; --surface-2:#332C27; --ink:#EDE5DA; --muted:#B0A497; --line:#3E3530;
  --brand:#DCCFC0; --brand-ink:#2F2925; --beige:#3A322C; --accent:#CDB07A; --cream:#DCCFC0;
  --good:#8CC79A; --good-bg:#1E3123; --warn:#E3BE6B; --warn-bg:#3A3018; --bad:#EE8D80; --bad-bg:#3D211D;
  --c1:#DCCFC0; --c2:#CDB07A; --c3:#9F8E7E; --c4:#E07A6C; --c5:#A3B188; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1916; --paper:#26211D; --surface:#2A2420; --surface-2:#332C27; --ink:#EDE5DA; --muted:#B0A497; --line:#3E3530;
  --brand:#DCCFC0; --brand-ink:#2F2925; --beige:#3A322C; --accent:#CDB07A; --cream:#DCCFC0;
  --good:#8CC79A; --good-bg:#1E3123; --warn:#E3BE6B; --warn-bg:#3A3018; --bad:#EE8D80; --bad-bg:#3D211D;
  --c1:#DCCFC0; --c2:#CDB07A; --c3:#9F8E7E; --c4:#E07A6C; --c5:#A3B188; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num,.r{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:11.5px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- khung ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--paper);border-right:2px solid var(--brand);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;color:var(--brand);scrollbar-width:thin}
.side .brand{padding:0 18px 16px;margin-bottom:6px;display:grid;gap:6px;justify-items:start;position:relative}
.side .brand::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:1px;background:var(--line)}
.blogo{width:150px;height:auto;aspect-ratio:382/152;color:var(--brand);display:block}
.bn{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.bv{font-size:11.5px;color:var(--muted);line-height:1.4}
.updchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--surface);border:1px solid var(--line);padding:3px 10px;border-radius:99px;white-space:nowrap;color:var(--ink)}
.updchip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.updchip.live .dot{background:var(--good)}.updchip.err .dot{background:var(--bad)}
.updchip.load .dot{background:var(--accent);animation:p 1s infinite alternate}@keyframes p{to{opacity:.3}}
.sgrp{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);padding:0 18px;margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.sgrp::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:grid;gap:1px}
.tabs button{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 18px;cursor:pointer;border-left:3px solid transparent;color:var(--ink)}
.tabs button:hover{background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--beige);border-left-color:var(--seal)}
.tabs .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--brand)}
.tabs .nm{font-weight:600;font-size:14px;display:grid;line-height:1.25}
.tabs .nm small{font-weight:400;font-size:11px;color:var(--muted)}
.tabs .cnt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tabs .cnt.hot{color:var(--seal)}
.sfoot{margin-top:auto;padding:14px 18px 0;display:grid;gap:6px}
.sbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12.5px;text-decoration:none;color:var(--ink)}
.sbtn:hover{border-color:var(--brand)}
main{min-width:0;padding:22px 28px 60px;display:grid;gap:14px;align-content:start;max-width:1320px}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mhead h1{font-size:30px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.1}
.mhead h1 em{font-style:normal;font-weight:300;color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--seal);margin-bottom:6px}
.mhead .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.cbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:default}
.jnav{display:flex;flex-wrap:wrap;gap:6px}
.jnav a,.jnav button{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--surface);cursor:pointer}
.jnav a:hover,.jnav button:hover{border-color:var(--brand);color:var(--ink)}
.jnav button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- thẻ ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0;box-shadow:var(--shadow);scroll-margin-top:20px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.ct .muted{letter-spacing:.04em;text-transform:none;font-family:var(--f-body)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{border-radius:8px;padding:11px 13px;display:grid;gap:3px;align-content:start;min-width:0;background:var(--surface);border:1px solid var(--line)}
.kpi .lb{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.main{background:linear-gradient(160deg,#3E3530,#54483F 70%);border-color:#3E3530;color:#FBF8F2}
.kpi.main .lb,.kpi.main .s{color:#DCCFC0}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--beige);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.j{background:#E9E4DD;color:#54483F}.pill.v{background:#F3DFDB;color:#A8322A}.pill.h{background:#EFE3C8;color:#6B4F3A}
.tblwrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:var(--brand);color:var(--brand-ink);font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
td.w{white-space:normal;min-width:220px;max-width:420px}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
td.code{font-family:var(--f-mono);font-size:11.5px;color:var(--brand)}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:0}
.inp:focus{border-color:var(--brand);outline:0}
.search{min-width:220px;flex:1;max-width:360px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.fi{display:grid;gap:4px}
.fi label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fi.wide{grid-column:span 2}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:99px}
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
.cols div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.cols div:hover{background:var(--accent)}
.list{display:grid;gap:0}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.li .meta{font-size:11.5px;color:var(--muted)}
.chk{width:18px;height:18px;border:1.5px solid var(--brand);border-radius:4px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--surface);margin-top:1px}
.chk.on{background:var(--brand)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid var(--brand-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.li.done .tx{text-decoration:line-through;color:var(--muted)}
.kan{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--beige);border-radius:8px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kcol h3{margin:0;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;display:grid;gap:3px;cursor:pointer}
.kc:hover{border-color:var(--brand)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--accent);font-size:13px}
.alert.bad{border-left-color:var(--seal);background:var(--bad-bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* ngăn kéo sửa */
.drawer{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1fr min(460px,100vw)}
.drawer .bg{background:rgba(30,25,22,.35)}
.drawer .pn{background:var(--surface);overflow-y:auto;padding:20px;display:grid;gap:12px;align-content:start;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.drawer h2{margin:0;font-size:20px;font-weight:600}
.drawer .form{grid-template-columns:1fr 1fr}
.drawer textarea{min-height:80px;resize:vertical}
/* màn kết nối */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login .box{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:14px;box-shadow:var(--shadow)}
.login .blogo{width:170px;justify-self:center;margin-bottom:6px}
.err{color:var(--bad);font-size:12.5px}
/* thanh dưới điện thoại */
.bnav{display:none}
.mtop{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g3,.g32{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{max-width:100vw}
  .mhead h1 em{display:block;font-size:.7em}
  .side{display:none}
  main{padding:14px 16px 92px}
  .mhead h1{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .kpi .v{font-size:20px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:2px solid var(--brand);position:sticky;top:0;z-index:30}
  .mtop .blogo{width:92px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .bnav button{display:grid;justify-items:center;gap:2px;min-height:58px;padding:7px 2px 5px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
  .bnav button[aria-current="page"]{color:var(--brand);border-top-color:var(--seal)}
  .bnav .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .search{max-width:none}
  .bar{grid-template-columns:84px 1fr 90px}
  .fi.wide{grid-column:auto}
  .drawer .form{grid-template-columns:1fr}
}
.msheet{position:fixed;inset:0;z-index:45;background:rgba(30,25,22,.35);display:grid;align-items:end}
.msheet .pn{background:var(--paper);border-radius:14px 14px 0 0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
</style>
</head>
<body>

<!-- màn kết nối -->
<div class="login" id="login" hidden>
  <form class="box" id="loginForm" autocomplete="off">
    <svg class="blogo" aria-label="Kai Jewelry"><use href="#logo-h"/></svg>
    <div><div class="eyebrow">Internal dashboard</div><div class="muted" style="font-size:13px">Dán link API (…/exec) và mã khóa ở tab <b>HuongDan</b> của Sheet "[Kai Jewelry] Working File". Mỗi máy nhập một lần, trình duyệt sẽ nhớ.</div></div>
    <div class="fi"><label for="lgApi">Link API</label><input class="inp" id="lgApi" placeholder="https://script.google.com/macros/s/…/exec" required></div>
    <div class="fi"><label for="lgKey">Mã khóa</label><input class="inp" id="lgKey" type="password" placeholder="kai-…" required></div>
    <div class="err" id="lgErr" hidden></div>
    <button class="btn pri" type="submit" id="lgBtn" style="justify-content:center;padding:9px">Kết nối</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" aria-label="Điều hướng">
    <div class="brand">
      <svg class="blogo" role="img" aria-label="Kai Jewelry"><use href="#logo-h"/></svg>
      <div class="bn">Internal dashboard</div>
      <div class="bv"><span id="hdrChao"></span><br><span id="hdrDate"></span></div>
      <span class="updchip" id="upd"><span class="dot"></span><span id="updTxt">Đang kết nối Google Sheet…</span></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Chọn trang"></nav>
    <div class="sfoot">
      <button class="sbtn" data-reload>⟳ Tải lại dữ liệu</button>
      <a class="sbtn" id="sheetLink" target="_blank" rel="noopener" hidden>▦ Mở Google Sheet</a>
      <button class="sbtn" id="themeBtn">◐ Sáng / tối</button>
    </div>
  </aside>
  <div style="min-width:0">
    <div class="mtop"><svg class="blogo" aria-label="Kai Jewelry"><use href="#logo-h"/></svg><span class="updchip" id="updM"><span class="dot"></span><span>…</span></span><button class="btn sm" data-reload aria-label="Tải lại">⟳</button></div>
    <main id="main"></main>
  </div>
  <nav class="bnav" id="bnav" aria-label="Điều hướng nhanh"></nav>
</div>
<div id="layer"></div>

<script>
/* Kai Jewelry dashboard · bản 1 (16/11/2026). Đọc / ghi Sheet "[Kai Jewelry] Working File" qua API Apps Script (sheet-api/src/Code.gs).
   Không có số liệu nào trong file này: link API + mã khóa lưu ở trình duyệt (localStorage), dữ liệu tải lần gần nhất cũng vậy. */
const BAN = 'v1 · 16/11/2026';
const LS = { get(k, d) { try { const v = localStorage.getItem('kj_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem('kj_' + k, JSON.stringify(v)); } catch (e) {} },
             del(k) { try { localStorage.removeItem('kj_' + k); } catch (e) {} } };
let CFG = LS.get('cfg', null), D = LS.get('cache', null), SHEET = LS.get('sheet', ''), VIEW = LS.get('view', 'ov');
const ST = { spDong: '', spTT: '', spQ: '', dhKenh: '', viecAi: '', viecAn: true, khoAn: true };

const DONG = ['Jewelry', 'Vận Số', 'Hoài Niệm', 'Tết'], MUC = { 'Jewelry': .5, 'Vận Số': .3, 'Hoài Niệm': .2 };
const TT_SP = ['Ý tưởng', 'Hỏi giá', 'Đặt mẫu', 'Đang bán', 'Tạm ngưng', 'Bỏ'];
const TT_LH = ['Hỏi giá', 'Đã đặt', 'Đang về', 'Đã về', 'Hủy'];
const TT_DH = ['Mới', 'Đang giao', 'Đã giao', 'Hoàn', 'Hủy'];
const KENH = ['TikTok Shop', 'Shopee', 'Website', 'Zalo', 'Tại quán', 'Khác'];
const TT_KOC = ['Chưa liên hệ', 'Đã nhắn', 'Đồng ý', 'Đã gửi hàng', 'Đã đăng', 'Từ chối'];
const TT_VIEC = ['Chưa làm', 'Đang làm', 'Chờ', 'Xong', 'Bỏ'];

const VIEWS = [
  { g: 'Bắt đầu' },
  { id: 'ov', ic: 'ov', t: 'Tổng quan', s: 'tóm tắt · việc cần chú ý' },
  { id: 'viec', ic: 'viec', t: 'Việc cần làm', s: 'chủ · bot · hạn · tick' },
  { g: 'Hàng hóa' },
  { id: 'sp', ic: 'sp', t: 'Sản phẩm', s: 'mã · giá · biên · ba dòng' },
  { id: 'lh', ic: 'lh', t: 'Lô hàng', s: 'đặt 1688 · xưởng · vốn' },
  { id: 'kho', ic: 'kho', t: 'Tồn kho', s: 'nhập · bán · còn' },
  { g: 'Bán hàng' },
  { id: 'dh', ic: 'dh', t: 'Đơn hàng', s: 'doanh thu · kênh · ngày' },
  { id: 'koc', ic: 'koc', t: 'KOC', s: 'liên hệ · gửi hàng · video' },
  { g: 'Hệ thống' },
  { id: 'kn', ic: 'kn', t: 'Kết nối', s: 'API · Sheet · có gì mới' },
];
const BNAV = ['ov', 'sp', 'dh', 'viec', 'more'];

/* ---------- tiện ích ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => { if (v === '' || v == null) return 0; const x = typeof v === 'number' ? v : parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(x) ? x : 0; };
const fm = v => Math.round(n(v)).toLocaleString('vi-VN');
const dd = v => v === '' || v == null ? '<span class="muted">–</span>' : fm(v) + 'đ';
const kk = v => { const x = n(v); if (!x) return '–'; if (Math.abs(x) >= 1e6) return (x / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' tr'; return Math.round(x / 1000) + 'K'; };
const pc = v => v === '' || v == null ? '–' : Math.round(n(v) * 100) + '%';
const day = s => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
const dmy = s => { const d = day(s); return d ? d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' }) : (s || ''); };
const hanDate = h => { const m = /(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/.exec(h || ''); if (!m) return null; let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000; return new Date(y, m[2] - 1, +m[1]); };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dongCls = d => d === 'Jewelry' ? 'j' : d === 'Vận Số' ? 'v' : d === 'Hoài Niệm' ? 'h' : '';
const ttCls = t => ['Xong', 'Đã về', 'Đã giao', 'Đang bán', 'Đã đăng'].includes(t) ? 'good' : ['Đang làm', 'Đang về', 'Đang giao', 'Đặt mẫu', 'Đã gửi hàng', 'Đồng ý', 'Đã đặt'].includes(t) ? 'warn' : ['Hủy', 'Bỏ', 'Hoàn', 'Từ chối', 'Tạm ngưng'].includes(t) ? 'bad' : '';
const pill = (t, c) => t ? `<span class="pill ${c == null ? ttCls(t) : c}">${esc(t)}</span>` : '';
const opts = (arr, cur, blank) => (blank != null ? `<option value="">${esc(blank)}</option>` : '') + arr.map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('');
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
const T = () => D || { SanPham: [], LoHang: [], DonHang: [], KOC: [], Viec: [] };

/* ---------- API ---------- */
async function api(params) {
  const u = new URL(CFG.api); u.searchParams.set('key', CFG.key); Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { redirect: 'follow' }); const j = await r.json(); if (!j.ok) throw new Error(j.loi || 'Lỗi API'); return j;
}
async function apiPost(body) {
  const r = await fetch(CFG.api, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: CFG.key }, body)) });
  const j = await r.json(); if (!j.ok) throw new Error(j.loi || 'Lỗi API'); return j;
}
function setUpd(cls, txt) { [$('#upd'), $('#updM')].forEach(e => { if (!e) return; e.className = 'updchip ' + cls; e.lastElementChild.textContent = txt; }); }
async function load(quiet) {
  if (!CFG) return;
  setUpd('load', 'Đang tải…'); $$('[data-reload]').forEach(b => b.disabled = true);
  try {
    const j = await api({ action: 'all' });
    D = j.du; SHEET = j.sheet || SHEET; LS.set('cache', D); LS.set('sheet', SHEET); LS.set('at', Date.now());
    setUpd('live', 'Đã cập nhật ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }));
    render();
  } catch (e) {
    const at = LS.get('at', 0);
    setUpd('err', at ? 'Mất kết nối · số lúc ' + new Date(at).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : 'Không kết nối được');
    if (!quiet) toast('Không tải được: ' + e.message);
  } finally { $$('[data-reload]').forEach(b => b.disabled = false); }
}
async function save(body, msg) {
  try { await apiPost(body); toast(msg || 'Đã lưu vào Sheet'); await load(true); return true; }
  catch (e) { toast('Chưa lưu được: ' + e.message); return false; }
}

/* ---------- số liệu dùng chung ---------- */
function thang(d0 = new Date()) { return T().DonHang.filter(r => { const d = day(r['Ngày']); return d && d.getMonth() === d0.getMonth() && d.getFullYear() === d0.getFullYear() && !['Hủy', 'Hoàn'].includes(r['Trạng thái']); }); }
const dsDong = () => DONG.filter(d => T().SanPham.some(r => r['Dòng'] === d));
const viecMo = () => T().Viec.filter(r => !['Xong', 'Bỏ'].includes(r['Trạng thái']));
const viecTre = () => viecMo().filter(r => { const h = hanDate(r['Hạn']); return h && h < today0(); });

/* ---------- khung ---------- */
function buildNav() {
  const cnt = { viec: () => viecMo().length, sp: () => T().SanPham.length, lh: () => T().LoHang.filter(r => ['Đã đặt', 'Đang về'].includes(r['Trạng thái'])).length, dh: () => thang().length, koc: () => T().KOC.length };
  $('#tabs').innerHTML = VIEWS.map(v => v.g ? `<div class="sgrp">${v.g}</div>` :
    `<button role="tab" data-v="${v.id}" aria-selected="${v.id === VIEW}"><svg class="ic"><use href="#i-${v.ic}"/></svg><span class="nm">${v.t}<small>${v.s}</small></span><span class="cnt${v.id === 'viec' && viecTre().length ? ' hot' : ''}">${cnt[v.id] ? (cnt[v.id]() || '') : ''}</span></button>`).join('');
  $('#bnav').innerHTML = BNAV.map(id => { const v = VIEWS.find(x => x.id === id) || { id: 'more', ic: 'more', t: 'Thêm' };
    return `<button data-v="${v.id}" ${v.id === VIEW || (id === 'more' && !BNAV.includes(VIEW)) ? 'aria-current="page"' : ''}><svg class="ic"><use href="#i-${v.ic}"/></svg>${v.t.replace('Việc cần làm', 'Việc').replace('Tổng quan', 'Tổng')}</button>`; }).join('');
}
function go(v) {
  if (v === 'more') return moreSheet();
  VIEW = v; LS.set('view', v); render(); window.scrollTo(0, 0);
}
function moreSheet() {
  $('#layer').innerHTML = `<div class="msheet" data-close><div class="pn"><nav class="tabs">${VIEWS.filter(v => v.id && !BNAV.includes(v.id)).map(v => `<button data-v="${v.id}" aria-selected="${v.id === VIEW}"><svg class="ic"><use href="#i-${v.ic}"/></svg><span class="nm">${v.t}<small>${v.s}</small></span><span></span></button>`).join('')}</nav></div></div>`;
}
function head(eyebrow, h1, em, sub, btns = '') {
  return `<div class="mhead"><div><div class="eyebrow">${eyebrow}</div><h1>${h1}${em ? ` <em>${em}</em>` : ''}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="cbtns">${btns}</div></div>`;
}
function jnav(items) { return `<nav class="jnav">${items.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('')}</nav>`; }
function render() {
  buildNav();
  const now = new Date(), h = now.getHours();
  $('#hdrChao').textContent = (h < 11 ? 'Chào buổi sáng' : h < 14 ? 'Chào buổi trưa' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối') + ', Khoa';
  $('#hdrDate').textContent = now.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  if (SHEET) { $('#sheetLink').href = SHEET; $('#sheetLink').hidden = false; }
  const f = { ov: vOv, viec: vViec, sp: vSp, lh: vLh, kho: vKho, dh: vDh, koc: vKoc, kn: vKn }[VIEW] || vOv;
  $('#main').innerHTML = f();
  $('#layer').innerHTML = '';
}

/* ---------- TỔNG QUAN ---------- */
function vOv() {
  const sp = T().SanPham, th = thang(), dt = th.reduce((a, r) => a + n(r['Thực nhận']), 0);
  const ton = sp.reduce((a, r) => a + Math.max(0, n(r['Tồn'])), 0), ban = sp.filter(r => r['Trạng thái'] === 'Đang bán').length;
  const lhMo = T().LoHang.filter(r => ['Đã đặt', 'Đang về'].includes(r['Trạng thái']));
  const tre = viecTre(), mo = viecMo();
  const sapHet = sp.filter(r => r['Trạng thái'] === 'Đang bán' && n(r['Tồn']) <= 3);
  const tong = sp.filter(r => MUC[r['Dòng']] != null).length || 1;
  const chuY = [
    ...tre.slice(0, 6).map(r => `<div class="alert bad"><div><b>Việc quá hạn ${esc(r['Hạn'])}:</b> ${esc(r['Việc'])} <span class="muted">· ${esc(r['Người làm'])}</span></div></div>`),
    ...sapHet.slice(0, 5).map(r => `<div class="alert"><div><b>${esc(r['Mã'])} sắp hết:</b> còn ${fm(r['Tồn'])} · ${esc(r['Tên'])}</div></div>`),
    ...lhMo.slice(0, 4).map(r => `<div class="alert"><div><b>Lô ${esc(r['ID'])} ${esc(r['Trạng thái']).toLowerCase()}:</b> ${esc(r['Mã SP'])} × ${fm(r['Số lượng'])}${r['Ngày về'] ? ' · về ' + dmy(r['Ngày về']) : ''}</div></div>`),
  ];
  const ganDay = T().DonHang.slice().sort((a, b) => String(b['Ngày']).localeCompare(String(a['Ngày']))).slice(0, 8);
  return head('Kai Jewelry · ' + new Date().toLocaleDateString('vi-VN', { month: 'long', year: 'numeric' }), 'Tổng quan', 'chi tiết nhỏ, phong thái lớn', 'ra mắt 06/12/2026 · Tết Đinh Mùi 06/02/2027') +
  jnav([['ov-kpi', 'Số chính'], ['ov-chuy', 'Cần chú ý'], ['ov-dong', 'Ba dòng'], ['ov-don', 'Đơn gần đây']]) +
  `<div class="kpis" id="ov-kpi">
    <div class="kpi main"><span class="lb">Doanh thu tháng</span><span class="v">${kk(dt)}</span><span class="s">${th.length} dòng đơn · thực nhận</span></div>
    <div class="kpi"><span class="lb">Mã theo dõi</span><span class="v">${sp.length}</span><span class="s">${ban} đang bán</span></div>
    <div class="kpi"><span class="lb">Tồn kho</span><span class="v">${fm(ton)}</span><span class="s">món · ${sapHet.length} mã sắp hết</span></div>
    <div class="kpi"><span class="lb">Lô đang về</span><span class="v">${lhMo.length}</span><span class="s">${kk(lhMo.reduce((a, r) => a + n(r['Thành tiền']), 0))} vốn</span></div>
    <div class="kpi"><span class="lb">KOC</span><span class="v">${T().KOC.length}</span><span class="s">${T().KOC.filter(r => r['Trạng thái'] === 'Đã đăng').length} đã đăng video</span></div>
    <div class="kpi"><span class="lb">Việc còn mở</span><span class="v">${mo.length}</span><span class="s" style="${tre.length ? 'color:var(--seal)' : ''}">${tre.length} quá hạn</span></div>
  </div>
  <div class="grid g32">
    <div class="card" id="ov-chuy"><div class="ct">Cần chú ý <span class="muted">${chuY.length || ''}</span></div>${chuY.join('') || '<div class="empty">Không có gì gấp. Mọi việc đúng hạn.</div>'}</div>
    <div class="card" id="ov-dong"><div class="ct">Ba dòng · 50 / 30 / 20 <span class="muted">theo số mã</span></div><div class="bars">${Object.keys(MUC).map(d => { const c = sp.filter(r => r['Dòng'] === d).length, p = c / tong;
      return `<div class="bar"><span>${pill(d, dongCls(d))}</span><div class="tr"><div class="fl" style="width:${Math.round(p * 100)}%"></div></div><span class="r num">${c} mã · ${Math.round(p * 100)}% <span class="muted">/ ${MUC[d] * 100}%</span></span></div>`; }).join('')}</div>
      <div class="muted" style="font-size:12px">Biên gộp trung bình (mã có giá vốn): <b>${pc(avg(sp.map(r => r['Biên gộp']).filter(x => x !== '')))}</b></div></div>
  </div>
  <div class="card" id="ov-don"><div class="ct">Đơn gần đây <button class="btn sm" data-v="dh">Xem tất cả →</button></div>${ganDay.length ? tbl(['Ngày', 'Kênh', 'Mã SP', 'SL', 'Thực nhận', 'Trạng thái'], ganDay.map(r => [dmy(r['Ngày']), esc(r['Kênh']), `<span class="mono">${esc(r['Mã SP'])}</span>`, fm(r['SL']), dd(r['Thực nhận']), pill(r['Trạng thái'])]), [3, 4]) : '<div class="empty">Chưa có đơn. Ghi đơn ở tab Đơn hàng.</div>'}</div>`;
}
const avg = a => a.length ? a.reduce((x, y) => x + n(y), 0) / a.length : '';
function tbl(h, rows, right = [], attrs) {
  return `<div class="tblwrap"><table><thead><tr>${h.map((x, i) => `<th class="${right.includes(i) ? 'r' : ''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r, j) => `<tr${attrs ? attrs(j) : ''}>${r.map((c, i) => `<td class="${right.includes(i) ? 'r num' : ''}${typeof c === 'string' && c.startsWith('<!--w-->') ? ' w' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const W = s => '<!--w-->' + s;

/* ---------- VIỆC ---------- */
function vViec() {
  const all = T().Viec, ai = [...new Set(all.map(r => r['Người làm']).filter(Boolean))];
  let ds = all.filter(r => (!ST.viecAi || r['Người làm'] === ST.viecAi) && (!ST.viecAn || !['Xong', 'Bỏ'].includes(r['Trạng thái'])));
  const nhom = [...new Set(ds.map(r => r['Nhóm']))];
  return head('Bắt đầu', 'Việc cần làm', `${viecMo().length} việc còn mở`, `${viecTre().length} quá hạn · tick là ghi "Xong" vào Sheet`, `<button class="btn pri" data-act="addViec">+ Thêm việc</button>`) +
  `<div class="fbar"><nav class="jnav"><button data-f="viecAi" data-val="" aria-pressed="${!ST.viecAi}">Tất cả</button>${ai.map(a => `<button data-f="viecAi" data-val="${esc(a)}" aria-pressed="${ST.viecAi === a}">${esc(a)}</button>`).join('')}</nav>
   <label class="muted" style="font-size:12.5px;display:flex;gap:6px;align-items:center"><input type="checkbox" data-f="viecAn" ${ST.viecAn ? 'checked' : ''}> Ẩn việc xong</label></div>` +
  (nhom.length ? nhom.map(g => `<div class="card"><div class="ct">${esc(g)} <span class="muted">${ds.filter(r => r['Nhóm'] === g).length}</span></div><div class="list">${ds.filter(r => r['Nhóm'] === g).map(r => { const h = hanDate(r['Hạn']), tre = h && h < today0() && !['Xong', 'Bỏ'].includes(r['Trạng thái']), xong = r['Trạng thái'] === 'Xong';
    return `<div class="li${xong ? ' done' : ''}"><span class="chk${xong ? ' on' : ''}" role="checkbox" aria-checked="${xong}" tabindex="0" data-tick="${esc(r['ID'])}"></span><div style="flex:1;min-width:0"><div class="tx">${esc(r['Việc'])}</div><div class="meta">${esc(r['Người làm'])}${r['Hạn'] ? ` · hạn <span style="${tre ? 'color:var(--seal);font-weight:600' : ''}">${esc(r['Hạn'])}</span>` : ''}${r['Nơi làm'] ? ' · ' + esc(r['Nơi làm']) : ''}${r['Ghi chú'] ? '<br>' + esc(r['Ghi chú']) : ''}</div></div>${pill(r['Trạng thái'])}<button class="btn sm" data-edit="Viec" data-id="${esc(r['ID'])}">Sửa</button></div>`; }).join('')}</div></div>`).join('') : '<div class="empty">Không còn việc nào. </div>');
}

/* ---------- SẢN PHẨM ---------- */
function spLoc() {
  const q = ST.spQ.trim().toLowerCase();
  return T().SanPham.filter(r => (!ST.spDong || r['Dòng'] === ST.spDong) && (!ST.spTT || r['Trạng thái'] === ST.spTT) && (!q || (r['Mã'] + ' ' + r['Tên'] + ' ' + r['Ghi chú']).toLowerCase().includes(q)));
}
function vSp() {
  const sp = T().SanPham, ds = spLoc();
  return head('Hàng hóa', 'Sản phẩm', `${sp.length} mã`, 'bấm một dòng để sửa giá, trạng thái, ghi chú', `<button class="btn pri" data-act="addSp">+ Thêm mã</button>`) +
  `<div class="kpis">${dsDong().map(d => { const x = sp.filter(r => r['Dòng'] === d); return `<div class="kpi"><span class="lb">${esc(d)}</span><span class="v">${x.length}</span><span class="s">${x.filter(r => r['Trạng thái'] === 'Đang bán').length} đang bán · giá ${kk(Math.min(...x.map(r => n(r['Giá KH'])).filter(Boolean)))}–${kk(Math.max(...x.map(r => n(r['Giá KH']))))}</span></div>`; }).join('')}

  const v = Object.assign({}, r, { __id: id });
  const ten = { SanPham: 'Sản phẩm', LoHang: 'Lô hàng', DonHang: 'Đơn hàng', KOC: 'KOC', Viec: 'Việc' }[tab];
  const calc = tab === 'SanPham' && id ? `<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="lb">Biên</span><span class="v">${pc(r['Biên gộp'])}</span></div><div class="kpi"><span class="lb">Đã bán</span><span class="v">${fm(r['Đã bán'])}</span></div><div class="kpi"><span class="lb">Tồn</span><span class="v">${r['Tồn'] === '' ? '–' : fm(r['Tồn'])}</span></div></div>` : '';
  $('#layer').innerHTML = `<div class="drawer"><div class="bg" data-close></div><div class="pn"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">${ten}${id ? ' · ' + esc(id) : ' · thêm mới'}</div><h2>${esc(r['Tên'] || r['Việc'] || r['Mã SP'] || (id ? id : 'Thêm ' + ten.toLowerCase()))}</h2></div><button class="btn sm" data-close aria-label="Đóng">✕</button></div>${calc}${formHtml(tab, id ? v : {}, !id)}</div></div>`;
  setTimeout(() => { const e = $('#layer .form .inp'); e && e.focus(); }, 30);
}

/* ---------- sự kiện ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-v],[data-reload],[data-f],[data-edit],[data-act],[data-close],[data-tick],[data-del],#themeBtn,.jnav a');
  if (!t) return;
  if (t.matches('.jnav a')) { e.preventDefault(); const x = document.getElementById(t.getAttribute('href').slice(1)); x && x.scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.close !== undefined && (e.target === t || t.tagName === 'BUTTON')) { $('#layer').innerHTML = ''; return; }
  if (t.dataset.v) return go(t.dataset.v);
  if (t.dataset.reload !== undefined) return load();
  if (t.id === 'themeBtn') { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; LS.set('theme', nx); return; }
  if (t.dataset.f && t.tagName === 'BUTTON') { ST[t.dataset.f] = t.dataset.val; return render(); }
  if (t.dataset.edit) return openDrawer(t.dataset.edit, t.dataset.id);
  if (t.dataset.tick) { const r = T().Viec.find(x => x['ID'] === t.dataset.tick); const moi = r['Trạng thái'] === 'Xong' ? 'Chưa làm' : 'Xong'; r['Trạng thái'] = moi; render(); return save({ action: 'update', tab: 'Viec', id: t.dataset.tick, data: { 'Trạng thái': moi } }, moi === 'Xong' ? 'Đã tick xong' : 'Đã mở lại việc'); }
  if (t.dataset.del) { if (!confirm('Xóa dòng ' + t.dataset.id + ' khỏi Sheet? Không hoàn tác được.')) return; if (await save({ action: 'delete', tab: t.dataset.del, id: t.dataset.id }, 'Đã xóa ' + t.dataset.id)) $('#layer').innerHTML = ''; return; }
  const a = t.dataset.act;
  if (a === 'addViec') return openDrawer('Viec', '');
  if (a === 'addSp') return openDrawer('SanPham', '');
  if (a === 'addKoc') return openDrawer('KOC', '');
  if (a === 'logout') { if (!confirm('Đăng xuất máy này? Link, mã khóa và số đã lưu trên trình duyệt sẽ bị xóa.')) return; ['cfg', 'cache', 'sheet', 'at'].forEach(LS.del); location.reload(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (CFG && VIEWS.some(v => v.id === h) && h !== VIEW) go(h); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#layer').innerHTML = ''; if ((e.key === ' ' || e.key === 'Enter') && e.target.dataset && e.target.dataset.tick) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && t.type === 'checkbox') { ST[t.dataset.f] = t.checked; return render(); }
  if (t.dataset.fsel) { ST[t.dataset.fsel] = t.value; return render(); }
  const f = t.closest('form[data-form="DonHang"]');
  if (f && (t.name === 'Mã SP' || t.name === 'Kênh')) { const sp = T().SanPham.find(r => r['Mã'] === f['Mã SP'].value); if (sp) { const g = f['Kênh'].value === 'Website' || f['Kênh'].value === 'Zalo' || f['Kênh'].value === 'Tại quán' ? sp['Giá web'] : sp['Giá sàn']; if (g) f['Đơn giá'].value = g; } }
});
document.addEventListener('input', e => { if (e.target.id === 'spQ') { ST.spQ = e.target.value; $('#spTbl').innerHTML = spTbl(spLoc()); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const tab = f.dataset.form, data = {}, key = tab === 'SanPham' ? 'Mã' : 'ID';
  FORM[tab].forEach(([k, t]) => { const el = f.elements[k]; if (!el) return; let v = el.value.trim(); if (t === 'n' && v !== '') v = n(v); data[k] = v; });
  const drawer = f.closest('.drawer'), id = drawer ? (f.querySelector('[data-del]') || {}).dataset?.id : '';
  if (tab === 'SanPham' && !id && !data['Mã']) return toast('Cần mã sản phẩm');
  if ((tab === 'DonHang' || tab === 'LoHang') && !data['Mã SP']) return toast('Chọn mã sản phẩm');
  const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Đang ghi…';
  const ok = id ? await save({ action: 'update', tab, id, data }, 'Đã lưu ' + id) : await save({ action: 'add', tab, data }, 'Đã ghi vào Sheet');
  if (ok && drawer) $('#layer').innerHTML = ''; else if (!ok) { btn.disabled = false; btn.textContent = 'Thử lại'; }
});

/* ---------- khởi động ---------- */
(function init() {
  const th = LS.get('theme', ''); if (th) document.documentElement.dataset.theme = th;
  const h = location.hash.slice(1); if (VIEWS.some(v => v.id === h)) VIEW = h;   // #sp, #dh… mở thẳng một tab
  const q = new URLSearchParams(location.search);
  if (q.get('api') && q.get('k')) { CFG = { api: q.get('api'), key: q.get('k') }; LS.set('cfg', CFG); history.replaceState(null, '', location.pathname + location.hash); }
  if (!CFG) { $('#login').hidden = false; return; }
  $('#app').hidden = false; render(); load(!!D);
})();
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); const api0 = $('#lgApi').value.trim(), key0 = $('#lgKey').value.trim(), err = $('#lgErr');
  err.hidden = true; $('#lgBtn').disabled = true; $('#lgBtn').textContent = 'Đang kiểm…';
  try { if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(api0)) throw new Error('Link phải là link Apps Script …/exec');
    CFG = { api: api0, key: key0 }; const j = await api({ action: 'ping' }); SHEET = j.sheet || ''; LS.set('cfg', CFG); LS.set('sheet', SHEET);
    $('#login').hidden = true; $('#app').hidden = false; render(); load();
  } catch (x) { CFG = null; err.textContent = 'Không kết nối được: ' + x.message; err.hidden = false; }
  finally { $('#lgBtn').disabled = false; $('#lgBtn').textContent = 'Kết nối'; }
});
</script>
